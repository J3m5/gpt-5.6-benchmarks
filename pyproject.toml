[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["scripts", "tests"]

[[tool.ty.overrides]]
include = ["tests/browser_verify.py"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["browser_harness.**"]
